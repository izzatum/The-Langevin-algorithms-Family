[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lafa"
dynamic = ["version"]
description = "Native PyTorch Langevin algorithms and uncertainty quantification"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["torch>=2.6"]

[project.urls]
Repository = "https://github.com/izzatum/The-Langevin-algorithms-Family"
Documentation = "https://izzatum.github.io/The-Langevin-algorithms-Family/"

[project.optional-dependencies]
test = ["pytest>=8"]
notebooks = ["jupyter>=1", "nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6", "matplotlib>=3.8", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

# Read statically from src/lafa/__init__.py (a plain string literal), so builds never import torch.
[tool.setuptools.dynamic]
version = {attr = "lafa.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
