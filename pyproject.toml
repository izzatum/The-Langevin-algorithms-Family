[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lafa"
version = "0.1.0"
description = "Native PyTorch Langevin algorithms and uncertainty quantification"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["torch>=2.6"]

[project.urls]
Repository = "https://github.com/izzatum/The-Langevin-algorithms-Family"
Documentation = "https://github.com/izzatum/The-Langevin-algorithms-Family/blob/main/docs/index.md"

[project.optional-dependencies]
test = ["pytest>=8"]
notebooks = ["jupyter>=1", "nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6", "matplotlib>=3.8", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
