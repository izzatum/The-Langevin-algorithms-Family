name: CPU tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test,notebooks]' build
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: python -m build
      - name: Execute tutorials
        if: matrix.python-version == '3.12'
        run: python scripts/execute_notebooks.py --device cpu --output /tmp/lafa-notebooks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-python-${{ matrix.python-version }}
          path: |
            test-results.xml
            /tmp/lafa-notebooks
            dist/
